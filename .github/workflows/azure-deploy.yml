name: CloudTaskManager CI/CD

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore CloudTaskManager.Api.csproj

      - name: Build
        run: dotnet build CloudTaskManager.Api.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish CloudTaskManager.Api.csproj --configuration Release --no-build --output ./publish